<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1180" height="640" fill="#ffffff"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b7791f"/>
    </marker>
  </defs>

  <text x="590" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#1a202c">CAMP v2 — how the board is wired</text>
  <text x="590" y="64" text-anchor="middle" font-size="15" fill="#4a5568">Everything plugs into the Arduino Nano. The board is the wiring, the resistors and the connectors.</text>

  <!-- MCU -->
  <rect x="455" y="215" width="270" height="215" rx="12" fill="#e9f2fb" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="590" y="253" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a365d">Arduino Nano</text>
  <text x="590" y="276" text-anchor="middle" font-size="14" fill="#2c5282">ATmega328P · 5 V · ARDUINO1</text>
  <line x1="480" y1="292" x2="700" y2="292" stroke="#a8c6e5" stroke-width="1.5"/>
  <text x="590" y="317" text-anchor="middle" font-size="13.5" fill="#2d3748">reads the sensors</text>
  <text x="590" y="339" text-anchor="middle" font-size="13.5" fill="#2d3748">decides what to show</text>
  <text x="590" y="361" text-anchor="middle" font-size="13.5" fill="#2d3748">drives the display + LEDs</text>
  <text x="590" y="394" text-anchor="middle" font-size="13" fill="#718096">USB also powers the board</text>
  <text x="590" y="414" text-anchor="middle" font-size="13" fill="#718096">while you are programming it</text>

  <!-- POWER -->
  <rect x="40" y="80" width="215" height="86" rx="10" fill="#fffaf0" stroke="#b7791f" stroke-width="2.5"/>
  <text x="147" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#744210">U1 · screw terminal</text>
  <text x="147" y="132" text-anchor="middle" font-size="13.5" fill="#975a16">5 V in, on the back side</text>
  <text x="147" y="152" text-anchor="middle" font-size="13.5" fill="#975a16">+ and − marked on silkscreen</text>
  <path d="M 255 123 L 415 123 L 415 232 L 452 232" fill="none" stroke="#b7791f" stroke-width="2.5" marker-end="url(#arp)"/>
  <text x="424" y="118" font-size="13" fill="#975a16" font-weight="bold">VIN</text>

  <!-- INPUTS (left) -->
  <g>
    <rect x="40" y="215" width="215" height="72" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2.5"/>
    <text x="147" y="243" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#22543d">DHT11</text>
    <text x="147" y="266" text-anchor="middle" font-size="13.5" fill="#276749">temperature + humidity</text>
    <path d="M 255 265 L 452 265" fill="none" stroke="#4a5568" stroke-width="2.2" marker-end="url(#ar)"/>
    <rect x="330" y="242" width="42" height="20" rx="5" fill="#ffffff" stroke="#cbd5e0"/>
    <text x="351" y="257" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2d3748">D2</text>
  </g>
  <g>
    <rect x="40" y="308" width="215" height="86" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2.5"/>
    <text x="147" y="336" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#22543d">MQ-7</text>
    <text x="147" y="359" text-anchor="middle" font-size="13.5" fill="#276749">carbon monoxide (CO)</text>
    <text x="147" y="379" text-anchor="middle" font-size="12.5" fill="#38a169">needs ~20 s to warm up</text>
    <path d="M 255 342 L 452 342" fill="none" stroke="#4a5568" stroke-width="2.2" marker-end="url(#ar)"/>
    <rect x="316" y="319" width="72" height="20" rx="5" fill="#ffffff" stroke="#cbd5e0"/>
    <text x="352" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3748">A7 · D12</text>
  </g>
  <g>
    <rect x="40" y="416" width="215" height="86" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2.5"/>
    <text x="147" y="444" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#22543d">SW1 · SW2 · SW3</text>
    <text x="147" y="467" text-anchor="middle" font-size="13.5" fill="#276749">next · previous · °C/°F</text>
    <text x="147" y="487" text-anchor="middle" font-size="12.5" fill="#38a169">pull the pin to GND when pressed</text>
    <path d="M 255 459 L 378 459 L 378 402 L 452 402" fill="none" stroke="#4a5568" stroke-width="2.2" marker-end="url(#ar)"/>
    <rect x="272" y="437" width="86" height="20" rx="5" fill="#ffffff" stroke="#cbd5e0"/>
    <text x="315" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3748">A0 · A1 · D8</text>
  </g>
  <text x="147" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#276749" letter-spacing="1.5">INPUTS</text>

  <!-- OUTPUTS (right) -->
  <g>
    <rect x="925" y="215" width="215" height="86" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2.5"/>
    <text x="1032" y="243" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#44337a">I²C LCD · 16×2</text>
    <text x="1032" y="266" text-anchor="middle" font-size="13.5" fill="#553c9a">shows one screen at a time</text>
    <text x="1032" y="286" text-anchor="middle" font-size="12.5" fill="#805ad5">address 0x27 (or 0x3F)</text>
    <path d="M 728 251 L 922 251" fill="none" stroke="#4a5568" stroke-width="2.2" marker-end="url(#ar)"/>
    <rect x="789" y="228" width="76" height="20" rx="5" fill="#ffffff" stroke="#cbd5e0"/>
    <text x="827" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3748">A4 · A5</text>
  </g>
  <g>
    <rect x="925" y="326" width="215" height="100" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2.5"/>
    <text x="1032" y="354" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#44337a">LED1 · LED2</text>
    <text x="1032" y="377" text-anchor="middle" font-size="13.5" fill="#553c9a">RGB status lights</text>
    <text x="1032" y="397" text-anchor="middle" font-size="12.5" fill="#805ad5">LED1 = temperature</text>
    <text x="1032" y="415" text-anchor="middle" font-size="12.5" fill="#805ad5">LED2 = air quality</text>
    <path d="M 728 342 L 800 342 L 800 372 L 922 372" fill="none" stroke="#4a5568" stroke-width="2.2" marker-end="url(#ar)"/>
    <rect x="742" y="319" width="150" height="20" rx="5" fill="#ffffff" stroke="#cbd5e0"/>
    <text x="817" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d3748">D3·D5·D6 / D9·D10·D11</text>
  </g>
  <text x="1032" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#553c9a" letter-spacing="1.5">OUTPUTS</text>

  <!-- resistors note -->
  <rect x="742" y="440" width="196" height="52" rx="8" fill="#fffff0" stroke="#d69e2e" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="840" y="461" text-anchor="middle" font-size="13" font-weight="bold" fill="#744210">R4–R9 · 220 Ω</text>
  <text x="840" y="480" text-anchor="middle" font-size="12.5" fill="#975a16">one in series with each colour</text>
  <line x1="840" y1="440" x2="840" y2="380" stroke="#d69e2e" stroke-width="1.8" stroke-dasharray="5 4"/>

  <!-- J5 -->
  <rect x="455" y="118" width="270" height="66" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2.5"/>
  <text x="590" y="144" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#742a2a">J5 “SEL” jumper</text>
  <text x="590" y="167" text-anchor="middle" font-size="13" fill="#9b2c2c">− = common-cathode LED · + = common-anode</text>
  <path d="M 725 151 L 800 151 L 800 300 L 925 355" fill="none" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- serial -->
  <path d="M 590 430 L 590 500" fill="none" stroke="#4a5568" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="440" y="500" width="300" height="60" rx="10" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="590" y="527" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2d3748">USB · Serial Monitor @ 9600</text>
  <text x="590" y="548" text-anchor="middle" font-size="13" fill="#4a5568">the “ground station” — live readings once a second</text>

  <text x="40" y="600" font-size="13" fill="#718096">Power the board from USB <tspan font-weight="bold">or</tspan> the screw terminal — not both at once.</text>
  <text x="1140" y="600" text-anchor="end" font-size="13" fill="#718096">80 × 80 mm · 2 layers · all through-hole</text>
</svg>
